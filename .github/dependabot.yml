updates:
  # NPM dependencies: keep non-breaking updates together
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions: group all updates into a single PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-ci-updates:
        patterns:
          - "*"
