name: Release

# One workflow handles both jobs of release-drafter:
#   - push to main (direct or via merged PR)  -> refresh a rolling draft release
#   - workflow_dispatch                       -> publish that release for real
# The changelog/version bump is computed here from actual commit messages
# (Conventional Commits) since the last vX.Y.Z tag, not from PR titles/labels,
# so it works the same whether commits land via a PR merge or a direct push.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        default: update_draft
        options:
          - update_draft
          - publish
      bump:
        description: 'Version bump to release (only used for publish)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      confirm:
        description: 'I confirm this will publish a real, non-draft release (only used for publish)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release_notes:
    if: github.repository == 'FredrikM97/mealplan-card' && github.repository_owner == 'FredrikM97'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine mode
        id: mode
        run: |
          MODE="notes"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.action }}" = "publish" ]; then
            if [ "${{ github.event.inputs.confirm }}" != "true" ]; then
              echo "::error::Re-run with 'confirm' checked to publish a real release."
              exit 1
            fi
            MODE="release"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build changelog and determine version
        id: notes
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="$LAST_TAG..HEAD"

          BUMP="patch"
          CHANGELOG=""
          CHORES=""
          COUNT=0

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            COUNT=$((COUNT + 1))

            if echo "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              BUMP="major"
            fi

            if echo "$subject" | grep -qiE '^feat(\([^)]*\))?!?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
              DESC=$(echo "$subject" | sed -E 's/^feat(\([^)]*\))?!?:[[:space:]]*//I')
              CHANGELOG="${CHANGELOG}- ${DESC}"$'\n'
            elif echo "$subject" | grep -qiE '^fix(\([^)]*\))?!?:'; then
              DESC=$(echo "$subject" | sed -E 's/^fix(\([^)]*\))?!?:[[:space:]]*//I')
              CHANGELOG="${CHANGELOG}- ${DESC}"$'\n'
            elif echo "$subject" | grep -qiE '^chore(\([^)]*\))?!?:'; then
              DESC=$(echo "$subject" | sed -E 's/^chore(\([^)]*\))?!?:[[:space:]]*//I')
              CHORES="${CHORES}- ${DESC}"$'\n'
            fi
          done <<< "$(git log $RANGE --no-merges --pretty=format:'%s')"

          if git log $RANGE --no-merges --pretty=format:'%b' | grep -q 'BREAKING CHANGE'; then
            BUMP="major"
          fi

          # Manual dispatch always forces the chosen bump instead of the detected one
          OVERRIDE="${{ github.event.inputs.bump }}"
          if [ -n "$OVERRIDE" ]; then
            BUMP="$OVERRIDE"
          fi

          BASE="${LAST_TAG#v}"
          BASE="${BASE:-0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          TAG="v$MAJOR.$MINOR.$PATCH"

          : > release-notes.md
          [ -n "$CHANGELOG" ] && { echo "## Changelog"; printf '%s' "$CHANGELOG"; echo; } >> release-notes.md
          [ -n "$CHORES" ] && { echo "## Maintenance"; printf '%s' "$CHORES"; echo; } >> release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## Changes" >> release-notes.md
            if [ "$COUNT" -gt 0 ]; then
              echo "- No categorized changes" >> release-notes.md
            else
              echo "- No changes" >> release-notes.md
            fi
          fi

          echo "## Contributors" >> release-notes.md
          CONTRIBUTORS=""
          while IFS= read -r hash; do
            [ -z "$hash" ] && continue
            LOGIN=$(gh api "repos/${{ github.repository }}/commits/$hash" --jq '.author.login // empty' 2>/dev/null || true)
            if [ -n "$LOGIN" ]; then
              CONTRIBUTORS="${CONTRIBUTORS}@${LOGIN}"$'\n'
            else
              CONTRIBUTORS="${CONTRIBUTORS}$(git log -1 --format='%an' "$hash")"$'\n'
            fi
          done <<< "$(git log $RANGE --no-merges --pretty=format:'%H')"
          CONTRIBUTORS=$(echo "$CONTRIBUTORS" | sed '/^$/d' | sort -u)
          if [ -n "$CONTRIBUTORS" ]; then
            echo "$CONTRIBUTORS" | sed 's/^/- /' >> release-notes.md
          else
            echo "- No contributors" >> release-notes.md
          fi
          echo >> release-notes.md

          # Draft compares against main since it isn't tagged yet; publishing
          # swaps this for the real previous-tag -> new-tag comparison.
          DIFF_TO="main"
          [ "${{ steps.mode.outputs.mode }}" = "release" ] && DIFF_TO="$TAG"
          if [ -n "$LAST_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${DIFF_TO}"
          else
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${DIFF_TO}"
          fi
          echo "---" >> release-notes.md
          echo "**Full Changelog**: $COMPARE_URL" >> release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing draft
        id: draft
        run: |
          DRAFT_TAG=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | head -1)
          echo "tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require an existing draft to publish
        if: steps.mode.outputs.mode == 'release' && steps.draft.outputs.tag == ''
        run: |
          echo "::error::No draft release found to publish. Push to main first to prepare one."
          exit 1

      - name: Remove previous draft
        if: steps.draft.outputs.tag != ''
        run: gh release delete "${{ steps.draft.outputs.tag }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling draft release
        if: steps.mode.outputs.mode == 'notes'
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "Unreleased" \
            --notes-file release-notes.md \
            --target main \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        if: steps.mode.outputs.mode == 'release'
        uses: actions/setup-node@v7

      - name: Build release asset
        if: steps.mode.outputs.mode == 'release'
        run: |
          npm install
          npm run version:update -- "${{ steps.notes.outputs.tag }}"
          npm run build

      - name: Publish release
        if: steps.mode.outputs.mode == 'release'
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file release-notes.md \
            --target main \
            --latest
          gh release upload "${{ steps.notes.outputs.tag }}" dist/mealplan-card.js --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
