name: Release

# One workflow handles both jobs of release-drafter:
#   - push to main (direct or via merged PR)  -> refresh a rolling draft release
#   - workflow_dispatch                       -> publish that release for real
# The draft changelog is built here from actual commit messages since the
# last vX.Y.Z tag, not from PR titles/labels, so it works the same whether
# commits land via a PR merge or a direct push. The version bump on publish
# is an explicit manual choice (patch/minor/major), not auto-detected.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        default: update_draft
        options:
          - update_draft
          - publish
      bump:
        description: 'Version bump to release (only used for publish)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  update_draft:
    if: |
      github.repository == 'FredrikM97/mealplan-card' && github.repository_owner == 'FredrikM97' &&
      (github.event_name == 'push' || github.event.inputs.action == 'update_draft')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog
        id: notes
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="$LAST_TAG..HEAD"

          CHANGELOG=""
          CHORES=""

          while IFS=$'\x01' read -r hash subject; do
            [ -z "$hash" ] && continue

            LOGIN=$(gh api "repos/${{ github.repository }}/commits/$hash" --jq '.author.login // empty' 2>/dev/null || true)
            if [ -n "$LOGIN" ]; then
              AUTHOR="@${LOGIN}"
            else
              AUTHOR=$(git log -1 --format='%an' "$hash")
            fi

            if echo "$subject" | grep -qiE '^build(\([^)]*\))?!?:'; then
              # Dependabot/renovate commits use the "build" conventional-commit type
              CHORES="${CHORES}- ${subject} (${AUTHOR})"$'\n'
            else
              CHANGELOG="${CHANGELOG}- ${subject} (${AUTHOR})"$'\n'
            fi
          done <<< "$(git log $RANGE --no-merges --pretty=format:'%H%x01%s')"

          : > release-notes.md
          [ -n "$CHANGELOG" ] && { echo "## Changelog"; printf '%s' "$CHANGELOG"; echo; } >> release-notes.md
          [ -n "$CHORES" ] && { echo "## Maintenance"; printf '%s' "$CHORES"; echo; } >> release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## Changes" >> release-notes.md
            echo "- No changes" >> release-notes.md
          fi

          # Draft always compares against main since it isn't tagged yet
          if [ -n "$LAST_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${LAST_TAG}...main"
          else
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/main"
          fi
          echo "---" >> release-notes.md
          echo "**Full Changelog**: $COMPARE_URL" >> release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling draft release
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release edit unreleased \
              --title "Unreleased" \
              --notes-file release-notes.md \
              --target main \
              --draft
          else
            gh release create unreleased \
              --title "Unreleased" \
              --notes-file release-notes.md \
              --target main \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare_release:
    if: |
      github.repository == 'FredrikM97/mealplan-card' && github.repository_owner == 'FredrikM97' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an existing draft to publish
        run: |
          if ! gh release view unreleased >/dev/null 2>&1; then
            echo "::error::No draft release found to publish. Push to main first to prepare one."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          BASE="${LAST_TAG#v}"
          BASE="${BASE:-0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Reuse draft notes with an updated compare link
        run: |
          gh release view unreleased --json body -q .body > release-notes.md
          # The draft compares LAST_TAG...main; swap "main" for the real new tag now that it exists
          sed -i "s#\.\.\.main#...${{ steps.version.outputs.tag }}#" release-notes.md
          sed -i "s#/commits/main#/commits/${{ steps.version.outputs.tag }}#" release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Build release asset
        run: |
          npm install
          npm run version:update -- "${{ steps.version.outputs.tag }}"
          npm run build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            release-notes.md
            dist/mealplan-card.js
          retention-days: 1

  publish_release:
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      - name: Publish release
        run: |
          gh release edit unreleased \
            --tag "${{ needs.prepare_release.outputs.tag }}" \
            --title "${{ needs.prepare_release.outputs.tag }}" \
            --notes-file release-notes.md \
            --target main \
            --draft=false \
            --latest
          gh release upload "${{ needs.prepare_release.outputs.tag }}" dist/mealplan-card.js --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
